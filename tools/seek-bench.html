<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>DE_Nachhall · V2b seek/暂停精度实测</title>
<style>
  body{font:14px/1.6 ui-monospace,Menlo,monospace;margin:24px;max-width:1000px;color:#171B1B}
  h1{font:600 20px/1.3 system-ui;margin:0 0 4px}
  p.sub{color:#6F7A7A;margin:0 0 20px}
  video{width:520px;background:#171B1B;border-radius:8px;display:block}
  button{font:500 13px system-ui;padding:8px 14px;border:1px solid #E3E8E8;background:#fff;
         border-radius:7px;cursor:pointer;margin-right:8px}
  button.pri{background:#0D9488;border-color:#0D9488;color:#fff}
  button:disabled{opacity:.45;cursor:not-allowed}
  table{border-collapse:collapse;width:100%;margin-top:16px;font-size:13px}
  th,td{text-align:right;padding:5px 9px;border-bottom:1px solid #F1F4F4}
  th:first-child,td:first-child{text-align:left}
  th{color:#6F7A7A;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
  .ok{color:#15803D;font-weight:600}
  .bad{color:#B91C1C;font-weight:600}
  #verdict{margin-top:18px;padding:14px 16px;border-radius:8px;background:#F1F4F4;
           font:14px/1.6 system-ui;white-space:pre-wrap}
  .row{display:flex;gap:20px;align-items:flex-start}
</style>
</head>
<body>
<h1>V2b · seek 与自动暂停精度实测</h1>
<p class="sub">
  验证 UI-SPEC 的 200 ms 指标。对比 <code>timeupdate</code> 与
  <code>requestVideoFrameCallback</code> 两种暂停判定方式。
</p>

<div class="row">
  <video id="v" src="./sample.mp4" preload="auto" muted playsinline></video>
  <div>
    <button id="run" class="pri">▶ 开始实测</button>
    <label style="font:13px system-ui;margin-right:12px">
      轮数
      <select id="rounds" style="font:13px system-ui;padding:4px 6px;border-radius:5px;border:1px solid #E3E8E8">
        <option value="12" selected>12 轮（约 90 秒）</option>
        <option value="20">20 轮（约 2.5 分钟）</option>
        <option value="6">6 轮（约 45 秒，快速看一眼）</option>
      </select>
    </label>
    <button id="copy">复制结果</button>
    <div id="status" style="margin-top:12px;color:#6F7A7A"></div>
  </div>
</div>

<table id="t">
  <thead><tr>
    <th>#</th><th>目标 start</th><th>seek 落点误差</th><th>seek 耗时</th>
    <th>目标 end</th><th>rVFC 暂停误差</th><th>timeupdate 暂停误差</th>
  </tr></thead>
  <tbody></tbody>
</table>

<div id="verdict"></div>

<script>
const v = document.getElementById('v');
const tbody = document.querySelector('#t tbody');
const statusEl = document.getElementById('status');
const verdict = document.getElementById('verdict');
const hasRVFC = 'requestVideoFrameCallback' in HTMLVideoElement.prototype;
const rows = [];

const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt = n => (n * 1000).toFixed(1);

function withTimeout(p, ms, what) {
  return Promise.race([
    p,
    new Promise((_, rej) => setTimeout(() => rej(new Error(`${what} 超时 ${ms}ms`)), ms)),
  ]);
}

function seekTo(t) {
  return withTimeout(new Promise(resolve => {
    const t0 = performance.now();
    const done = () => resolve({ ms: performance.now() - t0, landed: v.currentTime });
    v.addEventListener('seeked', done, { once: true });
    v.currentTime = t;
  }), 8000, 'seek');
}

// 用 rVFC 逐帧检查，到 end 立刻暂停
function playUntilRVFC(end) {
  return new Promise(resolve => {
    let stopped = false;
    const step = (_now, meta) => {
      if (stopped) return;
      if (meta.mediaTime >= end) {
        stopped = true;
        v.pause();
        resolve(meta.mediaTime);
        return;
      }
      v.requestVideoFrameCallback(step);
    };
    v.requestVideoFrameCallback(step);
    v.play().catch(e => resolve(Promise.reject(e)));
  });
}

// 只靠 timeupdate 检查（规范只保证约 4 次/秒）
function playUntilTimeupdate(end) {
  return new Promise(resolve => {
    const on = () => {
      if (v.currentTime >= end) {
        v.removeEventListener('timeupdate', on);
        v.pause();
        resolve(v.currentTime);
      }
    };
    v.addEventListener('timeupdate', on);
    v.play().catch(e => resolve(Promise.reject(e)));
  });
}

async function run() {
  if (!Number.isFinite(v.duration) || v.duration <= 0) {
    verdict.textContent = '视频还没加载完（duration 不可用）。\n' +
      '等状态栏出现「视频就绪」再点，或检查服务是否支持 Range 请求。';
    return;
  }
  document.getElementById('run').disabled = true;
  tbody.innerHTML = ''; rows.length = 0; verdict.textContent = '';
  const dur = v.duration;
  const N = Number(document.getElementById('rounds').value);
  // 片段长度只影响耗时，不影响测量 —— 暂停误差取决于跨过 end 那一刻的
  // 轮询粒度，与片段多长无关。用 2–3 秒把总时长压到约 90 秒。
  const SEG_MIN = 2.0, SEG_SPAN = 1.0;

  for (let i = 0; i < N; i++) {
    const start = 5 + Math.random() * (dur - 20);
    const end = start + SEG_MIN + Math.random() * SEG_SPAN;
    const eta = Math.round((N - i) * (SEG_MIN + SEG_SPAN / 2) * 2 + (N - i) * 0.4);
    statusEl.textContent = `第 ${i + 1} / ${N} 次…  约剩 ${eta} 秒`;

    const s = await seekTo(start);
    const seekErr = Math.abs(s.landed - start);

    const rvfcAt = hasRVFC ? await withTimeout(playUntilRVFC(end), 20000, "rVFC 播放") : null;
    const rvfcErr = rvfcAt === null ? null : Math.abs(rvfcAt - end);

    await seekTo(start);
    const tuAt = await withTimeout(playUntilTimeupdate(end), 20000, "timeupdate 播放");
    const tuErr = Math.abs(tuAt - end);

    const r = { i: i + 1, start, seekErr, seekMs: s.ms, end, rvfcErr, tuErr };
    rows.push(r);

    const cls = e => (e !== null && e * 1000 < 200) ? 'ok' : 'bad';
    tbody.insertAdjacentHTML('beforeend', `<tr>
      <td>${r.i}</td><td>${start.toFixed(2)}s</td>
      <td class="${cls(seekErr)}">${fmt(seekErr)} ms</td>
      <td>${s.ms.toFixed(0)} ms</td>
      <td>${end.toFixed(2)}s</td>
      <td class="${cls(rvfcErr)}">${rvfcErr === null ? '不支持' : fmt(rvfcErr) + ' ms'}</td>
      <td class="${cls(tuErr)}">${fmt(tuErr)} ms</td>
    </tr>`);
    await sleep(60);
  }

  statusEl.textContent = '';
  document.getElementById('run').disabled = false;
  report();
}

async function safeRun() {
  try {
    await run();
  } catch (e) {
    statusEl.textContent = '';
    document.getElementById('run').disabled = false;
    verdict.textContent =
      `实测中断：${e.message}\n\n` +
      `已完成 ${rows.length} 轮。\n` +
      `常见原因：\n` +
      `  · 服务不支持 Range 请求 → 浏览器无法 seek，seeked 事件不来\n` +
      `  · 自动播放被拦截 → 先手动点一下视频再重试\n` +
      (rows.length >= 3 ? '\n已有样本仍可参考：\n' : '');
    if (rows.length >= 3) report(true);
  }
}

function stats(xs) {
  const a = xs.filter(x => x !== null).sort((p, q) => p - q);
  if (!a.length) return null;
  const pct = p => a[Math.min(a.length - 1, Math.floor(a.length * p))];
  return { n: a.length, min: a[0], med: pct(.5), p95: pct(.95), max: a[a.length - 1],
           avg: a.reduce((s, x) => s + x, 0) / a.length };
}

function report(append) {
  const seek = stats(rows.map(r => r.seekErr));
  const rvfc = stats(rows.map(r => r.rvfcErr));
  const tu = stats(rows.map(r => r.tuErr));
  const line = (name, s) => s
    ? `${name.padEnd(22)} 中位 ${fmt(s.med).padStart(7)} ms   P95 ${fmt(s.p95).padStart(7)} ms   最大 ${fmt(s.max).padStart(7)} ms`
    : `${name.padEnd(22)} 不支持`;

  const pass = rvfc && rvfc.p95 * 1000 < 200;
  verdict.textContent = (append ? verdict.textContent : "") +
`浏览器: ${navigator.userAgent.match(/Chrome\/[\d.]+/)?.[0] || navigator.userAgent}
requestVideoFrameCallback: ${hasRVFC ? '支持' : '不支持'}
样本数: ${rows.length}

${line('seek 落点误差', seek)}
${line('rVFC 暂停误差', rvfc)}
${line('timeupdate 暂停误差', tu)}

结论: ${pass ? '✅ rVFC 的 P95 < 200 ms，UI-SPEC 指标可达成'
              : '❌ rVFC 的 P95 ≥ 200 ms，需修订 UI-SPEC 指标或改用其它方案'}
${tu && rvfc ? `\ntimeupdate 比 rVFC 差 ${(tu.p95 / rvfc.p95).toFixed(1)} 倍 —— 这就是不能只靠 timeupdate 的原因。` : ''}`;
}

document.getElementById('run').onclick = safeRun;
document.getElementById('copy').onclick = async () => {
  const txt = verdict.textContent.trim();
  const btn = document.getElementById('copy');
  if (!txt) { btn.textContent = '还没有结果'; setTimeout(() => btn.textContent = '复制结果', 1500); return; }
  try {
    await navigator.clipboard.writeText(txt);
    btn.textContent = '✓ 已复制';
  } catch {
    // 剪贴板不可用时退回选中，用户可手动 Ctrl+C
    const r = document.createRange(); r.selectNodeContents(verdict);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    btn.textContent = '已选中，按 Ctrl+C';
  }
  setTimeout(() => btn.textContent = '复制结果', 1800);
};
v.addEventListener('error', () => {
  statusEl.textContent = '视频加载失败';
  verdict.textContent = '视频加载失败。检查 tools/sample.mp4 是否存在，以及服务是否支持 Range。';
});
v.addEventListener('loadedmetadata', () => {
  statusEl.textContent = `视频就绪 ${v.duration.toFixed(1)}s · rVFC ${hasRVFC ? '支持' : '不支持'}`;
});
</script>
</body>
</html>
